<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Enquête clinique — Quest</title>
<meta name="description" content="Rejoins l'enquête clinique de ta classe avec le code affiché à l'écran." />
<meta name="theme-color" content="#D42A1C" />
<link rel="icon" href="../favicon.svg" />
<style>
/* ============================================================
   Enquête clinique — écran de l'élève (téléphone)
   Jeu coopératif : pas de points, pas de classement.
   Aucun nom, aucun compte, rien d'enregistré sur un serveur :
   le totem vit dans ce navigateur, les votes passent en direct.
   ============================================================ */
:root{
  --rouge:#D42A1C; --rouge-f:#A81E12; --encre:#1B1614; --texte:#4A423E; --gris:#8C8177;
  --or:#BF831A; --turq:#3F7A8A; --violet:#6B3FA0; --vert:#2E8B57;
  --fond:#FAF7F6; --carte:#FFFDF9; --ligne:#E7DFD0; --rose:#FBE7E4; --sable:#F4EFEA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root{ color-scheme: light; } html,body{ background:#FAF7F6 !important; color:#1B1614 !important; } }
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; background:var(--fond); color:var(--encre); font-family:"Trebuchet MS", system-ui, sans-serif; }
body{ min-height:100vh; min-height:100dvh; }
button,input{ font:inherit; }
.ecran{ max-width:560px; margin:0 auto; padding:max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
.haut{ display:flex; align-items:center; gap:10px; font-weight:700; }
.haut .mk{ width:34px; height:34px; border-radius:10px; background:var(--rouge); color:#fff; display:grid; place-items:center; font-size:18px; }
.haut .moi{ margin-left:auto; background:var(--rose); color:var(--rouge-f); border-radius:999px; padding:6px 12px; font-size:14px; max-width:60%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.centre{ flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; gap:14px; }
h1{ font-size:30px; margin:0; }
.sur{ font-size:12px; font-weight:700; letter-spacing:3px; color:var(--or); text-transform:uppercase; }
.muted{ color:var(--gris); }
.carte{ background:var(--carte); border:1px solid var(--ligne); border-radius:20px; padding:20px; box-shadow:0 2px 10px rgba(27,22,20,.06); }
.nip{ width:100%; text-align:center; font-size:44px; font-weight:800; letter-spacing:14px; padding:14px; border-radius:16px; border:2px solid var(--ligne); background:#fff; color:var(--encre); }
.nip:focus{ outline:none; border-color:var(--rouge); }
.btn{ width:100%; border:0; border-radius:16px; padding:18px; font-weight:700; font-size:20px; background:var(--rouge); color:#fff; }
.btn:disabled{ opacity:.45; }
.btn.sec{ background:var(--carte); color:var(--encre); border:1px solid var(--ligne); }
.erreur{ color:var(--rouge); font-weight:700; }
.gros{ font-size:72px; line-height:1; }
.totem{ font-size:28px; font-weight:800; }
.attente{ display:inline-flex; gap:6px; justify-content:center; }
.attente i{ width:10px; height:10px; border-radius:50%; background:var(--rouge); animation:saute 1s infinite ease-in-out; }
.attente i:nth-child(2){ animation-delay:.15s } .attente i:nth-child(3){ animation-delay:.3s }
@keyframes saute{ 0%,80%,100%{ transform:scale(.5); opacity:.4 } 40%{ transform:scale(1); opacity:1 } }
/* Jauge commune */
.jauge{ margin:12px 0 4px; display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; color:var(--gris); }
.jauge .piste{ flex:1; height:12px; border-radius:99px; background:var(--sable); border:1px solid var(--ligne); overflow:hidden; }
.jauge .rempli{ height:100%; border-radius:99px; transition:width 1.2s ease, background-color 1.2s ease; }
.jauge .etiq{ color:#fff; padding:3px 9px; border-radius:999px; white-space:nowrap; }
/* Contenu */
.pat{ text-align:left; }
.pat b{ font-size:20px; }
.pat p{ font-size:17px; line-height:1.45; margin:10px 0 0; color:var(--texte); }
.indice{ text-align:left; display:flex; gap:12px; align-items:flex-start; }
.indice .ico{ font-size:30px; line-height:1; }
.indice .type{ font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--gris); }
.indice p{ margin:4px 0 0; font-size:17px; line-height:1.4; font-weight:700; }
.qinfo{ display:flex; justify-content:space-between; align-items:center; margin:12px 0 8px; font-weight:700; color:var(--gris); }
.temps{ height:8px; border-radius:99px; background:var(--sable); overflow:hidden; }
.temps div{ height:100%; background:var(--rouge); transition:width .25s linear; }
.enonce{ font-size:20px; line-height:1.35; font-weight:700; margin:14px 0 14px; }
.choix{ display:grid; gap:12px; }
.ch{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:0; border-radius:16px; padding:15px; color:#fff; font-weight:700; font-size:17px; min-height:62px; line-height:1.3; }
.ch .l{ width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.22); display:grid; place-items:center; font-size:19px; flex:none; }
.c0{ background:var(--rouge); } .c1{ background:var(--turq); } .c2{ background:var(--or); } .c3{ background:var(--violet); }
.ch.choisi{ outline:5px solid var(--encre); outline-offset:2px; }
.ch.eteint{ opacity:.3; }
.ch:disabled{ cursor:default; }
.recu{ text-align:center; font-weight:700; color:var(--vert); margin-top:14px; }
.verdict{ border-radius:24px; padding:24px 18px; color:#fff; }
.verdict.ok{ background:var(--vert); } .verdict.non{ background:var(--or); } .verdict.rien{ background:var(--texte); }
.verdict .gros{ font-size:58px; }
.verdict h1{ font-size:26px; margin-top:8px; }
.verdict p{ margin:10px 0 0; font-size:17px; line-height:1.4; }
.retenir{ text-align:left; margin:6px 0 0; padding-left:20px; }
.retenir li{ margin-bottom:8px; line-height:1.4; color:var(--texte); }
.diag{ font-size:24px; font-weight:800; color:var(--rouge); }
.lien{ background:none; border:0; color:var(--gris); text-decoration:underline; font-size:15px; padding:8px; }
</style>
</head>
<body>
<div class="ecran" id="app"></div>

<script type="module">
import { createClient } from "/lib/supabase-2.119.2.esm.js";

const SUPABASE_URL = "https://gejmaxobebsamvfkkpoj.supabase.co";
const SUPABASE_KEY = "sb_publishable_jqf5eYy0Coka5d0-E86JJQ_bCiQDyvD";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* Mêmes listes que les apps Quest et que l'écran projeté (qui reconstruit le nom à partir des indices). */
const TOTEM_NOUNS = [["🦊","Renard","Fox","m"],["🦦","Loutre","Otter","f"],["🦫","Castor","Beaver","m"],["🦉","Hibou","Owl","m"],["🦡","Blaireau","Badger","m"],["🐺","Loup","Wolf","m"],["🦅","Aigle","Eagle","m"],["🐿️","Écureuil","Squirrel","m"],["🐗","Sanglier","Boar","m"],["🦔","Hérisson","Hedgehog","m"],["🐻","Ours","Bear","m"],["🦌","Cerf","Stag","m"],["🦆","Canard","Duck","m"],["🐇","Lièvre","Hare","m"],["🐢","Tortue","Turtle","f"],["🐸","Grenouille","Frog","f"],["🐝","Abeille","Bee","f"],["🐜","Fourmi","Ant","f"]];
const TOTEM_ADJ = [["Vaillant","Vaillante","Valiant"],["Rusé","Rusée","Cunning"],["Débrouillard","Débrouillarde","Resourceful"],["Malin","Maligne","Clever"],["Adroit","Adroite","Deft"],["Curieux","Curieuse","Curious"],["Ingénieux","Ingénieuse","Ingenious"],["Tenace","Tenace","Tenacious"],["Habile","Habile","Skillful"],["Vif","Vive","Quick"],["Futé","Futée","Sharp"],["Astucieux","Astucieuse","Astute"],["Persévérant","Persévérante","Persistent"],["Audacieux","Audacieuse","Bold"],["Minutieux","Minutieuse","Meticulous"],["Agile","Agile","Agile"],["Bricoleur","Bricoleuse","Handy"],["Éveillé","Éveillée","Bright"],["Appliqué","Appliquée","Diligent"],["Costaud","Costaude","Sturdy"]];
const tirer = () => ({ n: Math.floor(Math.random() * TOTEM_NOUNS.length), a: Math.floor(Math.random() * TOTEM_ADJ.length) });
function totemDe(t) {
  const N = TOTEM_NOUNS[t.n], A = TOTEM_ADJ[t.a];
  return { emoji: N[0], nom: `${N[1]} ${N[3] === "f" ? A[1] : A[0]}` };
}
const TYPES = { signes: ["🩺", "Signes vitaux"], parole: ["💬", "Ce qu'on te dit"], observation: ["👀", "Observation"], resultat: ["🧪", "Résultat"], dossier: ["📋", "Dossier et médication"] };
function etiquette(v) {
  if (v < 25) return ["Critique", "#D42A1C"];
  if (v < 50) return ["Préoccupant", "#BF831A"];
  if (v < 75) return ["Stable", "#3F7A8A"];
  return ["En voie d'amélioration", "#2E8B57"];
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const lire = (k, d) => { try { const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const ecrire = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} };

const params = new URLSearchParams(location.search);
const S = {
  ecran: "code",          // code · recherche · totem · partie
  nip: (params.get("pin") || "").replace(/\D/g, "").slice(0, 4),
  erreur: "", canal: null, hid: null, seq: -1, etat: null,
  id: null, totem: null, inscrit: false,
  vk: null, choix: null, finLocale: 0,   // vote en cours : clé ("h" ou n° d'étape) et choix
  monHypo: null,                          // texte de mon hypothèse (pour le dénouement)
};

/* ---------------------------------------------------------- canal */
async function rejoindre(nip) {
  S.nip = nip; S.erreur = ""; S.ecran = "recherche"; rendre();
  if (S.canal) { try { await supabase.removeChannel(S.canal); } catch {} }
  S.hid = null; S.seq = -1; S.etat = null;
  S.canal = supabase.channel("enquete-" + nip, { config: { broadcast: { self: false } } });
  S.canal.on("broadcast", { event: "etat" }, ({ payload }) => recevoirEtat(payload));
  S.canal.subscribe((s) => { if (s === "CHANNEL_ERROR" || s === "TIMED_OUT") { S.erreur = "Connexion perdue… on réessaie."; rendre(); } });
  // L'écran projeté diffuse son état toutes les 1,5 s : sans nouvelles après 5 s, le code est faux.
  setTimeout(() => { if (!S.etat && S.ecran === "recherche") { S.ecran = "code"; S.erreur = "Aucune enquête avec ce code. Vérifie les chiffres à l'écran."; rendre(); } }, 5000);
}
function recevoirEtat(e) {
  if (!e || typeof e.seq !== "number") return;
  if (S.hid && e.hid !== S.hid) return;      // on reste fidèle au premier écran projeté entendu
  if (!S.hid) S.hid = e.hid;
  if (e.seq <= S.seq) return;                // messages arrivés dans le désordre
  S.seq = e.seq;
  S.etat = e;
  if (S.ecran === "recherche") {
    const memo = lire("enquete_" + S.nip, null);
    S.id = memo?.id || Math.random().toString(36).slice(2, 12);
    S.totem = memo?.totem || tirer();
    S.ecran = memo ? "partie" : "totem";
    if (memo) annoncer(); else rendre();
  }
  S.inscrit = Array.isArray(e.inscrits) && e.inscrits.includes(S.id);
  if (S.ecran === "partie" && !S.inscrit && e.phase !== "ferme") annoncer();   // perdu en route ? on se réannonce
  if (e.v) {
    if (S.vk !== e.v.cle) { S.vk = e.v.cle; S.choix = null; }
    S.finLocale = Date.now() + e.v.restant;
    if (S.choix !== null && !(e.repondu || []).includes(S.id)) envoyerVote();   // vote perdu : on le renvoie
  }
  if (e.phase === "lobby") S.monHypo = null;   // nouveau cas
  if (S.ecran === "partie") rendreSiChange();
}
let signature = "";
function rendreSiChange() {
  const e = S.etat;
  const sig = [e.phase, e.titre, e.e, e.v?.cle, S.choix, S.inscrit, (e.repondu || []).includes(S.id), e.jauge, !!e.suspense, e.nbHypo].join("|");
  if (sig === signature) return;
  signature = sig; rendre();
}
function annoncer() {
  if (!S.canal || !S.totem) return;
  S.canal.send({ type: "broadcast", event: "rejoindre", payload: { id: S.id, n: S.totem.n, a: S.totem.a } });
}
function envoyerVote() {
  S.canal.send({ type: "broadcast", event: "vote", payload: { id: S.id, k: S.vk, c: S.choix } });
}

/* ---------------------------------------------------------- rendu */
const $ = document.getElementById("app");
const haut = () => `<div class="haut"><span class="mk">🔎</span><span>Enquête clinique</span>${S.totem && S.ecran === "partie" ? `<span class="moi">${totemDe(S.totem).emoji} ${esc(totemDe(S.totem).nom)}</span>` : ""}</div>`;
const jauge = () => {
  const v = S.etat?.jauge;
  if (typeof v !== "number") return "";
  const [lbl, coul] = etiquette(v);
  return `<div class="jauge"><span>État du patient</span><div class="piste"><div class="rempli" style="width:${v}%;background:${coul}"></div></div><span class="etiq" style="background:${coul}">${lbl}</span></div>`;
};
const patient = (avecTexte) => {
  const p = S.etat.patient; if (!p) return "";
  return `<div class="carte pat"><div class="sur">📁 Dossier</div><b>${esc(p.nom)}, ${p.age} ans</b><div class="muted">${esc(p.milieu)}</div>${avecTexte && S.etat.ouverture ? `<p>${esc(S.etat.ouverture)}</p>` : ""}</div>`;
};
const indice = () => {
  const i = S.etat.indice; if (!i) return "";
  const [ico, lbl] = TYPES[i.type] || ["🔎", "Indice"];
  return `<div class="carte indice"><span class="ico">${ico}</span><div><div class="type">Indice ${S.etat.e + 1} sur ${S.etat.total} · ${lbl}</div><p>${esc(i.texte)}</p></div></div>`;
};

function rendre() {
  if (S.ecran === "code" || S.ecran === "recherche") return rendreCode();
  if (S.ecran === "totem") return rendreTotem();
  const e = S.etat;
  if (!e) return;
  const f = { lobby: rendreAttente, entracte: rendreEntracte, dossier: rendreDossier, hypothese: rendreVote, hypoFin: rendreHypoFin,
    indice: rendreIndice, decision: rendreVote, resultat: rendreResultat, denouement: rendreDenouement, ferme: rendreFerme }[e.phase];
  if (f) f();
}
function rendreCode() {
  const cherche = S.ecran === "recherche";
  $.innerHTML = `${haut()}<div class="centre">
    <div class="gros">🔎</div><h1>Enquête clinique</h1><p class="muted" style="margin:0">Entre le code affiché à l'écran</p>
    <input class="nip" id="nip" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" value="${esc(S.nip)}" placeholder="••••" ${cherche ? "disabled" : ""} />
    ${S.erreur ? `<div class="erreur">${esc(S.erreur)}</div>` : ""}
    <button class="btn" id="ok" ${S.nip.length === 4 && !cherche ? "" : "disabled"}>${cherche ? "Recherche de l'enquête…" : "Entrer"}</button>
  </div>`;
  const inp = $.querySelector("#nip"), ok = $.querySelector("#ok");
  inp.addEventListener("input", () => { S.nip = inp.value.replace(/\D/g, "").slice(0, 4); inp.value = S.nip; ok.disabled = S.nip.length !== 4; });
  inp.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && S.nip.length === 4) rejoindre(S.nip); });
  ok.addEventListener("click", () => rejoindre(S.nip));
  if (!cherche && !S.nip) inp.focus();
}
function rendreTotem() {
  const tot = totemDe(S.totem);
  $.innerHTML = `${haut()}<div class="centre">
    <div class="sur">Ton équipe d'enquête</div>
    <p class="muted" style="margin:0">Ton totem pour cette enquête</p>
    <div class="carte"><div class="gros">${tot.emoji}</div><div class="totem" style="margin-top:10px">${esc(tot.nom)}</div></div>
    <button class="btn sec" id="autre">🎲 Changer de totem</button>
    <button class="btn" id="go">C'est parti !</button>
  </div>`;
  $.querySelector("#autre").addEventListener("click", () => { S.totem = tirer(); rendreTotem(); });
  $.querySelector("#go").addEventListener("click", () => {
    ecrire("enquete_" + S.nip, { id: S.id, totem: S.totem });
    S.ecran = "partie"; signature = ""; annoncer(); garderEcranAllume(); rendreSiChange();
  });
}
function rendreAttente() {
  const tot = totemDe(S.totem);
  $.innerHTML = `${haut()}<div class="centre">
    <div class="gros">${tot.emoji}</div><div class="totem">${esc(tot.nom)}</div>
    <h1 style="font-size:26px">${S.inscrit ? "Tu es dans l'équipe !" : "Connexion à l'enquête…"}</h1>
    ${S.etat.titre ? `<div class="sur">Cas · ${esc(S.etat.titre)}</div>` : ""}
    <p class="muted" style="margin:0">Toute la classe enquête ensemble. Regarde l'écran : le dossier arrive.</p>
    <div class="attente"><i></i><i></i><i></i></div>
  </div>`;
}
function rendreEntracte() {
  $.innerHTML = `${haut()}<div class="centre">
    <div class="gros">🗂️</div><h1 style="font-size:26px">Prochain cas en préparation…</h1>
    <p class="muted" style="margin:0">Garde cette page ouverte : tu restes dans l'équipe.</p>
    <div class="attente"><i></i><i></i><i></i></div>
  </div>`;
}
function rendreDossier() {
  $.innerHTML = `${haut()}${jauge()}<div class="centre" style="justify-content:flex-start;margin-top:10px">
    ${patient(true)}
    <p class="muted" style="margin:0">Lis le dossier avec la classe. Tu vas bientôt choisir ton hypothèse de départ.</p>
  </div>`;
}
function rendreVote() {
  const e = S.etat, v = e.v, hypo = v.cle === "h";
  const repondu = S.choix !== null; const recu = (e.repondu || []).includes(S.id);
  $.innerHTML = `${haut()}${jauge()}
    ${hypo ? patient(false) : indice()}
    <div class="qinfo"><span>${hypo ? "Hypothèse de départ 🔒" : `Décision ${e.e + 1} sur ${e.total}`}</span><span id="sec"></span></div>
    <div class="temps"><div id="barre"></div></div>
    <div class="enonce">${esc(v.texte)}</div>
    <div class="choix">${v.choix.map((c, k) => `<button class="ch c${k} ${repondu ? (k === S.choix ? "choisi" : "eteint") : ""}" data-k="${k}" ${repondu ? "disabled" : ""}><span class="l">${"ABCD"[k]}</span><span>${esc(c)}</span></button>`).join("")}</div>
    ${repondu ? `<p class="recu">${recu ? (hypo ? "Hypothèse reçue ✓ Elle reste secrète jusqu'au dénouement." : "Vote reçu ✓") : "Envoi…"}</p>` : ""}`;
  $.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => {
    if (S.choix !== null || Date.now() > S.finLocale) return;
    S.choix = Number(b.dataset.k);
    if (hypo) S.monHypo = v.choix[S.choix];
    envoyerVote();
    if (navigator.vibrate) navigator.vibrate(30);
    rendreSiChange();
  }));
  tic(v.duree || v.restant);
}
let ticId = null;
function tic(dureeInit) {
  clearInterval(ticId);
  const maj = () => {
    const r = Math.max(0, S.finLocale - Date.now());
    const b = document.getElementById("barre"), s = document.getElementById("sec");
    if (!b) return clearInterval(ticId);
    b.style.width = Math.min(100, (r / Math.max(dureeInit, 1)) * 100) + "%";
    s.textContent = Math.ceil(r / 1000) + " s";
    if (r <= 0 && S.choix === null) { $.querySelectorAll("[data-k]").forEach((x) => { x.disabled = true; x.classList.add("eteint"); }); s.textContent = "Temps écoulé !"; clearInterval(ticId); }
  };
  maj(); ticId = setInterval(maj, 250);
}
function rendreHypoFin() {
  const a = (S.etat.aVote || []).includes(S.id);
  $.innerHTML = `${haut()}${jauge()}<div class="centre">
    <div class="gros">🔒</div>
    <h1 style="font-size:24px">${a ? "Ton hypothèse est sous scellé." : "Pas d'hypothèse cette fois."}</h1>
    ${a && S.monHypo ? `<p class="muted" style="margin:0">Ton pari : <b>${esc(S.monHypo)}</b></p>` : ""}
    <p class="muted" style="margin:0">${S.etat.nbHypo} hypothèse${S.etat.nbHypo > 1 ? "s" : ""} dans la classe. On verra au dénouement qui avait vu juste. Place aux indices !</p>
  </div>`;
}
function rendreIndice() {
  $.innerHTML = `${haut()}${jauge()}<div class="centre" style="justify-content:flex-start;margin-top:10px">
    ${indice()}
    <p class="muted" style="margin:0">Observe bien. Qu'est-ce que cet indice t'apprend ? Le vote arrive.</p>
  </div>`;
}
function rendreResultat() {
  const e = S.etat, r = e.r;
  const juste = (e.justes || []).includes(S.id), vote = (e.votants || []).includes(S.id);
  const cls = juste ? "ok" : vote ? "non" : "rien";
  const bon = r.choix[r.bon];
  $.innerHTML = `${haut()}${jauge()}<div class="centre">
    <div class="verdict ${cls}">
      <div class="gros">${juste ? "✓" : vote ? "↺" : "⏱"}</div>
      <h1>${juste ? "Bonne conduite !" : vote ? "Pas la meilleure conduite" : "Pas de vote"}</h1>
      ${juste ? "" : `<p>✓ ${esc(bon)}</p>`}
    </div>
    <div class="muted" style="font-weight:700">${e.r.comptes.reduce((s, x) => s + x, 0) ? `${r.pct} % de la classe a vu juste` : ""}</div>
    <div class="carte" style="text-align:left"><div class="sur">La suite</div><p style="margin:8px 0 0;line-height:1.4">${esc(r.suite)}</p></div>
  </div>`;
}
function rendreDenouement() {
  const e = S.etat;
  if (e.suspense || !e.d) {
    $.innerHTML = `${haut()}<div class="centre"><div class="sur">Dénouement</div><div class="gros">🔎</div><h1>Regarde l'écran !</h1><p class="muted">Ce qui se passait vraiment…</p></div>`;
    return;
  }
  const d = e.d;
  const juste = (e.hypoJustes || []).includes(S.id), a = (e.aVote || []).includes(S.id);
  $.innerHTML = `${haut()}${jauge()}<div class="centre" style="justify-content:flex-start;margin-top:10px">
    <div class="sur">Ce qui se passait vraiment</div>
    <div class="diag">${esc(d.titre)}</div>
    <div class="verdict ${juste ? "ok" : a ? "non" : "rien"}">
      <h1 style="margin:0">${juste ? "🎯 Tu avais vu juste dès le départ !" : a ? "Ton hypothèse de départ était différente." : "Tu n'avais pas d'hypothèse de départ."}</h1>
      <p>${d.nbJustes} sur ${d.nbHypo} dans la classe avaient vu juste.</p>
    </div>
    <div class="carte" style="text-align:left"><div class="sur">À retenir</div><ol class="retenir">${d.aRetenir.map((t) => `<li>${esc(t)}</li>`).join("")}</ol></div>
    <p class="muted" style="margin:0">Bravo pour ton enquête ! Garde la page ouverte : un autre cas peut suivre.</p>
  </div>`;
}
function rendreFerme() {
  $.innerHTML = `${haut()}<div class="centre">
    <div class="gros">👏</div><h1>Enquête terminée</h1>
    <p class="muted">Merci pour ta participation ! Tu peux fermer cette page.</p>
    <button class="lien" id="autre">Rejoindre une autre enquête</button>
  </div>`;
  $.querySelector("#autre").addEventListener("click", async () => {
    if (S.canal) { try { await supabase.removeChannel(S.canal); } catch {} S.canal = null; }
    S.ecran = "code"; S.nip = ""; S.erreur = ""; S.etat = null; signature = ""; rendre();
  });
}

/* Garde l'écran du téléphone allumé pendant la partie (si le navigateur le permet). */
async function garderEcranAllume() {
  try { if ("wakeLock" in navigator) { const w = await navigator.wakeLock.request("screen"); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") garderEcranAllume(); }, { once: true }); return w; } } catch {}
}

rendre();
if (S.nip.length === 4) rejoindre(S.nip);
</script>
