<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vote des affiches — Quest</title>
<meta name="description" content="Votez pour l'affiche Quest que vous préférez pour vos élèves." />
<meta name="theme-color" content="#D42A1C" />
<link rel="icon" href="../favicon.svg" />
<style>
/* ============================================================
   Vote des affiches — écran de l'enseignante (téléphone)
   Anonyme : aucun nom, aucun compte, rien d'enregistré sur un
   serveur. Le vote passe en direct à l'écran projeté.
   ============================================================ */
:root{
  --rouge:#D42A1C; --rouge-f:#A81E12; --encre:#1B1614; --texte:#4A423E; --gris:#8C8177;
  --or:#BF831A; --vert:#2E8B57; --fond:#FAF7F6; --carte:#FFFDF9; --ligne:#E7DFD0; --rose:#FBE7E4; --sable:#F4EFEA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ html,body{ background:#FAF7F6 !important; color:#1B1614 !important; } }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--fond); color:var(--encre); font-family:"Trebuchet MS", system-ui, sans-serif; }
button{ font:inherit; }
.ecran{ max-width:560px; margin:0 auto; padding:max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
.haut{ display:flex; align-items:center; gap:10px; font-weight:700; }
.haut .mk{ width:34px; height:34px; border-radius:10px; background:var(--rouge); color:#fff; display:grid; place-items:center; font-size:18px; }
.sur{ font-size:12px; font-weight:700; letter-spacing:3px; color:var(--or); text-transform:uppercase; margin:22px 0 4px; }
h1{ font-size:28px; margin:0 0 6px; line-height:1.15; }
.muted{ color:var(--gris); margin:0; }
.prog{ margin-top:22px; }
.prog h2{ font-size:19px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
.prog h2 .pastille{ font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--sable); color:var(--texte); }
.prog h2 .pastille.ok{ background:var(--vert); color:#fff; }
.cartes{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
.c{ position:relative; border:0; padding:0; background:var(--carte); border-radius:14px; overflow:hidden; box-shadow:0 1px 6px rgba(27,22,20,.12); text-align:left; }
.c img{ display:block; width:100%; aspect-ratio:1632/2112; object-fit:cover; background:var(--sable); }
.c .nom{ display:block; min-height:3.1em; padding:7px 8px 9px; font-size:13px; font-weight:700; line-height:1.2; }
.c .nom b{ color:var(--rouge); }
.c.choisi{ outline:4px solid var(--rouge); outline-offset:2px; }
.c.choisi::after{ content:"✓"; position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%; background:var(--rouge); color:#fff; display:grid; place-items:center; font-weight:800; }
.c.eteint{ opacity:.45; }
.loupe{ display:block; width:100%; margin-top:6px; border:0; background:none; color:var(--gris); font-size:13px; text-decoration:underline; padding:4px; }
.btn{ width:100%; border:0; border-radius:16px; padding:18px; font-weight:700; font-size:19px; background:var(--rouge); color:#fff; margin-top:26px; }
.btn:disabled{ opacity:.4; }
.btn.sec{ background:var(--carte); color:var(--encre); border:1px solid var(--ligne); margin-top:12px; }
.merci{ text-align:center; margin-top:40px; }
.merci .gros{ font-size:72px; }
.recap{ display:grid; gap:10px; margin-top:20px; text-align:left; }
.recap div{ background:var(--carte); border:1px solid var(--ligne); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; }
.recap img{ width:44px; border-radius:6px; }
.statut{ margin-top:16px; font-size:15px; font-weight:700; }
.statut.ok{ color:var(--vert); } .statut.att{ color:var(--or); }
.zoom{ position:fixed; inset:0; background:rgba(27,22,20,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; z-index:10; }
.zoom img{ max-width:100%; max-height:82vh; border-radius:12px; }
.zoom button{ margin-top:14px; border:0; border-radius:99px; padding:12px 26px; font-weight:700; background:#fff; color:var(--encre); }
.ferme{ text-align:center; margin-top:60px; }
</style>
</head>
<body>
<div class="ecran" id="app"></div>
<div id="zoom"></div>

<script type="module">
import { createClient } from "/lib/supabase-2.119.2.esm.js";

const SUPABASE_URL = "https://gejmaxobebsamvfkkpoj.supabase.co";
const SUPABASE_KEY = "sb_publishable_jqf5eYy0Coka5d0-E86JJQ_bCiQDyvD";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const TOUR = "final-2026-11";   // vote final : A, D, E, F (votes enregistrés dans Supabase)

const STYLES = [["A", "Le téléphone"], ["D", "La compétition"], ["E", "Le classement"], ["F", "L'évolution"]];
const PROGS = [["s", "SASI", "SASIQuest"], ["p", "PAB", "PABQuest"]];

const lire = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let id = lire("vote-id");
if (typeof id !== "string" || id.length < 4) { id = Math.random().toString(36).slice(2, 10); ecrire("vote-id", id); }

let sauve = lire("vote-choix") || {};
if (sauve.tour !== TOUR) sauve = {};                       // anciens votes (tour précédent) : on repart à zéro
const S = {
  choix: { s: sauve.s ?? null, p: sauve.p ?? null },
  envoye: !!sauve.envoye,
  recu: !!sauve.recu, erreur: "", ouvert: true,
};
const garder = () => ecrire("vote-choix", { s: S.choix.s, p: S.choix.p, envoye: S.envoye, recu: S.recu, tour: TOUR });

/* ---------------------------------------------------------- enregistrement
   Chaque vote est ENREGISTRÉ (fonction voter_affiche) : plus besoin que l'écran
   des résultats soit ouvert. Un vote par téléphone ; le dernier remplace. */
async function envoyer() {
  S.erreur = ""; rendreStatut();
  const { data, error } = await supabase.rpc("voter_affiche", { p_tour: TOUR, p_votant: id, p_s: S.choix.s, p_p: S.choix.p });
  if (error) { S.recu = false; S.erreur = "Le vote n'a pas pu être envoyé. Vérifiez votre connexion, puis réessayez."; }
  else if (data === "ferme") { S.recu = false; S.ouvert = false; }
  else if (data === "ok") { S.recu = true; }
  else { S.recu = false; S.erreur = "Le vote n'a pas pu être enregistré."; }
  garder(); rendre();
}

/* ---------------------------------------------------------- affichage */
const app = document.getElementById("app");
const img = (st, pr) => `${st}-${pr}.jpg`;

function rendre() {
  if (!S.ouvert) {
    app.innerHTML = `${entete()}<div class="ferme"><div style="font-size:64px">🗳️</div><h1>Le vote est terminé</h1><p class="muted">Merci ! Philippe vous communiquera l'affiche gagnante.</p></div>`;
    return;
  }
  if (S.envoye) {
    app.innerHTML = `${entete()}
      <div class="merci"><div class="gros">🙌</div><h1>Merci pour votre vote !</h1>
        <div class="recap">${PROGS.filter(([k]) => S.choix[k] !== null).map(([k, pr, nom]) => {
          const [l, t] = STYLES[S.choix[k]];
          return `<div><img src="${img(l, pr)}" alt=""><span><b>${nom}</b><br>Affiche ${l} · ${t}</span></div>`;
        }).join("")}</div>
        <div class="statut" id="statut"></div>
      </div>
      ${S.ouvert ? `<button class="btn sec" id="modif">Modifier mon vote</button>` : ""}`;
    const m = document.getElementById("modif");
    if (m) m.onclick = () => { S.envoye = false; garder(); rendre(); };
    rendreStatut();
    return;
  }
  const pret = S.choix.s !== null || S.choix.p !== null;
  app.innerHTML = `${entete()}
    <div class="sur">Vote anonyme · 1 clic</div>
    <h1>Vote final : quelle affiche ?</h1>
    <p class="muted">Touchez votre préférée. Votez pour votre programme, ou pour les deux.</p>
    ${PROGS.map(([k, pr, nom]) => `
      <section class="prog">
        <h2>${nom} <span class="pastille ${S.choix[k] !== null ? "ok" : ""}">${S.choix[k] !== null ? "✓ choisie" : "facultatif"}</span></h2>
        <div class="cartes">${STYLES.map(([l, t], i) => `
          <div>
            <button class="c ${S.choix[k] === i ? "choisi" : S.choix[k] !== null ? "eteint" : ""}" data-k="${k}" data-i="${i}" aria-label="${nom}, affiche ${l}, ${t}">
              <img src="${img(l, pr)}" alt="" loading="lazy"><span class="nom"><b>${l}</b> · ${t}</span>
            </button>
            <button class="loupe" data-z="${img(l, pr)}">🔍 Agrandir</button>
          </div>`).join("")}
        </div>
      </section>`).join("")}
    <button class="btn" id="go" ${pret ? "" : "disabled"}>Envoyer mon vote</button>`;
  app.querySelectorAll(".c").forEach((b) => b.onclick = () => {
    const k = b.dataset.k, i = Number(b.dataset.i);
    S.choix[k] = S.choix[k] === i ? null : i; garder(); rendre();
  });
  app.querySelectorAll(".loupe").forEach((b) => b.onclick = () => zoom(b.dataset.z));
  document.getElementById("go").onclick = () => { S.envoye = true; S.recu = false; garder(); rendre(); envoyer(); };
}
function entete() { return `<div class="haut"><div class="mk">Q</div><span>Quest · CFP L'Envol</span></div>`; }
function rendreStatut() {
  const el = document.getElementById("statut"); if (!el) return;
  if (S.recu) { el.className = "statut ok"; el.textContent = "✓ Vote enregistré. Vous pouvez fermer la page."; }
  else if (S.erreur) { el.className = "statut att"; el.innerHTML = S.erreur + ' <button class="btn sec" id="reessai" style="margin-top:10px">Réessayer</button>'; document.getElementById("reessai").onclick = envoyer; }
  else { el.className = "statut att"; el.textContent = "Envoi en cours…"; }
}
function zoom(src) {
  const z = document.getElementById("zoom");
  z.innerHTML = `<div class="zoom"><img src="${src}" alt=""><button>Fermer</button></div>`;
  z.querySelector("button").onclick = () => z.innerHTML = "";
  z.querySelector(".zoom").onclick = (e) => { if (e.target.classList.contains("zoom")) z.innerHTML = ""; };
}
if (S.envoye && !S.recu) envoyer();   // vote resté en suspens (page fermée trop tôt) : on le renvoie
rendre();
</script>
</body>
</html>
